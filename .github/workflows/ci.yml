name: CI

# Build + test on every push to `main` and every PR. The job also packages
# a development `.app` and uploads it as a workflow artifact, so any
# contributor can grab a current build from the run summary page without
# cutting a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build · test · package
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test --parallel --enable-code-coverage

      - name: Bundle .app
        run: ./scripts/bundle.sh debug

      - name: Zip .app (CI artifacts can't preserve symlinks reliably)
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Peel.app Peel-dev.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Peel-dev-${{ github.sha }}
          path: build/Peel-dev.zip
          retention-days: 30
