name: CI

# Build + test on every push to `main` and every PR. Uses `macos-latest`
# so GitHub picks the freshest stable runner image automatically; the
# Xcode selector then prefers Xcode 26 and falls back to the highest
# Xcode that's actually installed on the image. The job packages a
# development `.app` and uploads it as a workflow artifact so any
# contributor can grab a current build from the run summary page
# without cutting a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build · test · package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer Xcode 26 (Swift 6.3); otherwise take whichever Xcode is
          # latest on the runner image — Peel's Package.swift only needs
          # Swift 6.0 language mode, which any Xcode 16+ provides.
          candidates=$(ls -d /Applications/Xcode_26* /Applications/Xcode_16* 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$candidates" ]]; then
            candidates="/Applications/Xcode.app"
          fi
          echo "Using $candidates"
          sudo xcode-select -s "$candidates/Contents/Developer"
          echo "DEVELOPER_DIR=$candidates/Contents/Developer" >> "$GITHUB_ENV"
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test --parallel --enable-code-coverage

      - name: Bundle .app
        run: ./scripts/bundle.sh debug

      - name: Zip .app (ditto preserves resource forks; zip drops them)
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Peel.app Peel-dev.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Peel-dev-${{ github.sha }}
          path: build/Peel-dev.zip
          retention-days: 30
