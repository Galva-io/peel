name: Bug report
description: Something Peel does isn't right.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Peel
        2. Add app context …
        3. Send getTransactionHistory …
    validations:
      required: true
  - type: input
    id: peel-version
    attributes:
      label: Peel version (Peel → About)
      placeholder: 1.0.0 (42)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 14.5
  - type: dropdown
    id: environment
    attributes:
      label: Environment when the bug occurred
      options:
        - Sandbox
        - Production
        - Both
        - Neither / setup screen
  - type: textarea
    id: logs
    attributes:
      label: Console logs (optional)
      description: From Console.app, filter by subsystem `io.galva.peel`. Please redact transaction IDs and emails before pasting.
